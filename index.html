<style>
/* Layout: full-bleed pixel world on canvas; HUD pinned to the corners; terminal windows float above the field */
:root{
  color-scheme:dark;
  --void:#050507;
  --panel:#0B0B10;
  --panel-2:#13121B;
  --line:#2A2738;
  --fg:#E4E1EA;
  --fg-2:#BDB8C8;
  --muted:#8A8697;
  --green:#6FE58A;
  --purple:#B79CFF;
  --ink:#07070A;
  --display:'DotGothic16','Courier New',monospace;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--fg);font-family:var(--mono);font-size:13px;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}

.px{clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px))}

/* HUD */
.hud-tl{position:fixed;left:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.logo{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.02em}
.logo small{font-size:13px;color:var(--green);margin-left:6px}
.coords{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.count{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;color:var(--fg-2)}
.cells{display:flex;gap:3px}
.cells i{width:8px;height:8px;border:1px solid var(--line);display:block}
.cells i.on{background:var(--green);border-color:var(--green)}
.hud-tr{position:fixed;right:16px;top:calc(14px + env(safe-area-inset-top,0px));z-index:5;display:flex;gap:8px}
.seg{display:flex;border:2px solid var(--line);background:var(--panel)}
.seg button,.hbtn{font-family:var(--mono);font-size:11px;letter-spacing:.08em;background:var(--panel);color:var(--muted);border:0;padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.hbtn{border:2px solid var(--line);color:var(--fg)}
.hbtn:hover,.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]:hover{color:var(--ink)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;pointer-events:none;background:rgba(5,5,7,.7);padding:6px 10px}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);z-index:15;background:var(--panel);border:2px solid var(--green);color:var(--green);padding:8px 12px;font-size:12px;letter-spacing:.06em;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* touch controls */
#joy{position:fixed;left:24px;bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:2px solid var(--line);background:rgba(11,11,16,.55);z-index:6;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--fg);opacity:.85;box-shadow:0 0 0 4px rgba(228,225,234,.12)}
#act{position:fixed;right:24px;bottom:calc(44px + env(safe-area-inset-bottom,0px));z-index:6;width:84px;height:84px;border:2px solid var(--green);background:var(--panel);color:var(--green);font-family:var(--mono);font-size:11px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
#act b{font-family:var(--display);font-size:26px;font-weight:400;line-height:1}

/* windows */
.scrim{position:fixed;inset:0;background:rgba(5,5,7,.45);z-index:18}
.win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--panel);border:2px solid var(--line);z-index:20;user-select:text;--a:var(--green)}
.bar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;background:var(--panel-2);border-bottom:2px solid var(--line);font-size:12px;color:var(--muted);z-index:1}
.dots{display:flex;gap:5px}
.dots i{width:8px;height:8px;display:block;background:var(--line)}
.dots i:first-child{background:var(--a)}
.path{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{background:none;border:2px solid var(--line);color:var(--fg);font-family:var(--mono);font-size:12px;padding:3px 8px;cursor:pointer}
.x:hover{border-color:var(--fg)}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;background:transparent;color:var(--fg);border:2px solid var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.btn.primary{background:var(--a);border-color:var(--a);color:var(--ink)}
.btn.off{opacity:.4;cursor:not-allowed;border-style:dashed}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

.spawn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:22px 20px 22px 22px}
.spawn-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--green)}
.big{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,78px);line-height:.88;margin:0;letter-spacing:.01em}
.studio{font-family:var(--display);font-size:20px;color:var(--green);margin-top:-6px}
.cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.win p{margin:0;max-width:56ch;line-height:1.65;color:var(--fg-2)}
.team{font-size:12px;color:var(--fg);border-top:1px solid var(--line);padding-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;letter-spacing:.06em;border:1px dashed var(--line);padding:5px 8px;color:var(--muted)}
.chip b{color:var(--fg);font-weight:500}
a.chip{text-decoration:none;border-style:solid;color:var(--fg-2)}
a.chip:hover{border-color:var(--green);color:var(--fg)}
.controls{font-size:11px;color:var(--muted)}
.vert{writing-mode:vertical-rl;font-size:10px;letter-spacing:.22em;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;text-transform:uppercase}

.art{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;padding:22px}
.icon-wrap{display:flex;flex-direction:column;gap:10px;width:104px}
.icon-wrap canvas{width:104px;height:104px;image-rendering:pixelated;background:var(--panel-2);border:2px solid var(--line);display:block}
.name{font-family:var(--display);font-size:30px;line-height:1;color:var(--a);overflow-wrap:anywhere}
.box{position:relative;border:1px solid var(--line);padding:16px 12px 12px;min-width:0;align-self:start}
.legend{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--panel);padding:0 8px;color:var(--a);font-size:11px;letter-spacing:.1em}
.row{display:grid;grid-template-columns:8ch minmax(0,1fr);gap:10px;padding:3px 0;font-size:12px}
.row b{color:var(--a);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.row span{color:var(--fg);overflow-wrap:anywhere}
.stages{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.stage{font-size:10px;letter-spacing:.06em;padding:3px 6px;border:1px solid var(--line);color:var(--muted)}
.stage.past{color:var(--fg-2)}
.stage.on{background:var(--a);border-color:var(--a);color:var(--ink)}
.full{grid-column:1/-1}
.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

.list-head{padding:22px 22px 6px;display:flex;flex-direction:column;gap:6px}
.list-head h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;padding:16px 22px 22px}
.card{display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;align-items:center;border:2px solid var(--line);padding:12px;background:var(--panel-2);cursor:pointer;text-align:left;color:var(--fg);font-family:var(--mono)}
.card:hover{border-color:var(--c)}
.card canvas{width:48px;height:48px;image-rendering:pixelated;display:block}
.card .n{font-family:var(--display);font-size:20px;color:var(--c);line-height:1.1}
.card .t{font-size:11px;color:var(--muted);margin-top:3px}
.card .s{font-size:10px;letter-spacing:.06em;color:var(--fg-2);margin-top:6px}

@media (max-width:560px){
  .win{top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-height:calc(100% - 90px)}
  .vert{display:none}
  .spawn{grid-template-columns:1fr;padding:18px}
  .art{grid-template-columns:1fr;padding:18px}
  .icon-wrap{flex-direction:row;align-items:center;width:auto;gap:14px}
  .icon-wrap canvas{width:64px;height:64px}
  .logo{font-size:24px}
  .hint{display:none}
}
/* title screen: full-screen, centered column; map breathes behind it */
#title{--a:var(--green);position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;gap:28px;
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(90% 70% at 50% 45%,rgba(5,5,7,.78),rgba(5,5,7,.95));overflow-y:auto;overflow-x:hidden;transition:opacity .45s ease,visibility .45s}
#title.out{opacity:0;visibility:hidden}
.t-top{display:flex;justify-content:flex-end;flex:none}
.t-mid{margin:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;width:100%;max-width:620px}
.t-logo{width:clamp(88px,14vw,128px);height:auto;aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 2px var(--line),0 0 0 7px var(--void),0 0 0 8px rgba(111,229,138,.35);display:block}
.t-mark{font-size:11px;letter-spacing:.24em;color:var(--green);text-transform:uppercase}
.t-name{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(30px,7vw,68px);line-height:1;letter-spacing:.04em;white-space:nowrap;color:var(--fg)}
.t-studio{font-family:var(--display);font-size:clamp(20px,2.4vw,28px);color:var(--green);line-height:1}
.t-motto{font-size:12px;letter-spacing:.14em;color:var(--muted)}
.t-text{display:flex;flex-direction:column;gap:10px;max-width:52ch}
.t-text p{margin:0;color:var(--fg-2);font-size:14px;line-height:1.65}
.t-go{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:4px}
.t-go .btn{font-size:13px;padding:14px 24px}
.t-key{font-size:11px;color:var(--muted);letter-spacing:.04em;line-height:1.6}
.t-bot{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;border-top:1px solid var(--line);padding-top:16px;text-align:center}
.t-team{color:var(--fg-2);display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:center}
.t-team b{color:var(--fg);font-weight:500}
.t-links{display:flex;gap:8px 18px;flex-wrap:wrap;justify-content:center}
.t-links a{color:var(--fg-2);text-decoration:none;letter-spacing:.06em}
.t-links a:hover{color:var(--green)}
.t-links span{color:var(--muted);user-select:text}
.hud-logo{width:30px;height:30px;border-radius:50%;box-shadow:0 0 0 1px var(--line);image-rendering:auto}
.logo{display:flex;align-items:center;gap:8px}
body.titled .hud-tl,body.titled .hud-tr,body.titled .hint,body.titled #joy,body.titled #act{visibility:hidden}
@media (max-width:560px){
  .t-go,.t-go .btn{width:100%}.t-go .btn{justify-content:center}
}
@media (prefers-reduced-motion:reduce){.cur{animation:none}.toast{transition:none}#title{transition:none}}
</style>

function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const mask=new Uint8Array(G*G);
for(let y=0;y<G;y++)for(let x=0;x<G;x++){const dx=x-CX,dy=y-CY,d2=dx*dx+dy*dy;let v;if(d2<380*380)v=1;else if(d2>480*480)v=0;else{let a=Math.atan2(dy,dx);if(a<0)a+=Math.PI*2;const r=RAD[((a/(Math.PI*2))*720|0)%720];v=d2<r*r?1:0}mask[y*G+x]=v}
const M=(x,y)=>{x|=0;y|=0;return x>=0&&y>=0&&x<G&&y<G&&mask[y*G+x]===1};

  if(mask[y*G+x]){
   const dx=x-CX,dy=y-CY,dd=Math.sqrt(dx*dx+dy*dy);
   if(dd<=PLAT){
    if(dd>PLAT-3)c=[50,46,68];

   }else if(!M(x,y-2)||!M(x-2,y)||!M(x+2,y)||!M(x,y+2)){c=[44,40,60]}
   else{const s=hash(x,y);c=hash(x>>3,y>>3)<.5?[13,13,19]:[15,15,22];if(s<.006)c=[30,29,40];else if(s<.008)c=[22,36,28]}
  }else{
   const maxK=8+hash(x>>2,9)*12|0;
   for(let k=1;k<=maxK;k++){if(M(x,y-k)){const f=k/maxK,v=hash(x,3)<.3?.7:1;c=[(30-20*f)*v,(27-18*f)*v,(44-30*f)*v];break}}
  }
  if(c){d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}
 }
 g.putImageData(img,0,0);
 const R=rng(7);
 // paths from spawn
 for(const a of ARTS){const dx=a.x-CX,dy=a.y-CY,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
  for(let s=PLAT+8;s<L-22;s+=7){const w=Math.sin(s*.035+a.x)*6,x=CX+ux*s-uy*w,y=CY+uy*s+ux*w;if(M(x,y)){g.fillStyle=a.secret?'#16151E':'#1F1D2A';g.fillRect(x|0,y|0,2,2)}}}
 // tufts, pebbles, shards
 for(let n=0;n<1300;n++){const x=R()*G|0,y=R()*G|0;if(!M(x,y)||!M(x,y+3)||Math.hypot(x-CX,y-CY)<PLAT+10)continue;
  if(ARTS.some(a=>Math.hypot(a.x-x,a.y-y)<26))continue;const r=R();
  if(r<.6){g.fillStyle='#1B3324';g.fillRect(x,y,1,2);g.fillRect(x+2,y,1,2);g.fillRect(x-2,y+1,1,1);g.fillStyle='#27492F';g.fillRect(x,y-1,1,1);g.fillRect(x+2,y,1,1)}
  else if(r<.88){g.fillStyle='#22212C';g.fillRect(x,y,3,2);g.fillStyle='#34323F';g.fillRect(x,y,2,1)}
  else{g.fillStyle='#352B57';g.fillRect(x,y,1,3);g.fillRect(x+2,y+1,1,2);g.fillStyle='#6A56B0';g.fillRect(x,y,1,1)}}

/* ---------- drawing helpers ---------- */
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x*P-OX,y*P-OY,w*P,h*P)}
function w2s(x,y){return{x:x*P-OX,y:y*P-OY}}
function sprite(rows,pal,x0,y0,flip,shift){for(let r=0;r<rows.length;r++){const row=rows[r],sh=shift?shift(r):0;for(let c=0;c<row.length;c++){const ch=row[flip?row.length-1-c:c];if(ch==='.')continue;px(x0+c+sh,y0+r,1,1,pal[ch])}}}
function iconPal(a){return{'#':a.col,'+':a.col2}}

function drawPlayer(t){
 const x=Math.round(player.x),y=Math.round(player.y);
 px(x-6,y,12,1,'rgba(0,0,0,.55)');px(x-5,y+1,10,1,'rgba(0,0,0,.35)');
 // blink: every 2.5-6s, sometimes twice
 if(!RM&&t>blinkAt){blinkEnd=t+.13;blinkAt=t+(Math.random()<.25?.32:2.5+Math.random()*3.5)}
 const eyesOn=RM||t>blinkEnd;
 const f=Math.floor(player.walk)%2;
 const rows=SPR[player.dir==='left'||player.dir==='right'?'side':player.dir];
 const flip=player.dir==='left';
 const tip=player.moving?(f?1:0):(RM?0:Math.round(Math.sin(t*1.6)*.7));
 const hem=player.moving?(f?1:-1):0;
 const x0=x-7,y0=y-22,eyes=[];
 for(let r=0;r<rows.length;r++){const row=rows[r],sh=r<2?tip:(r>=19&&r<=20?hem:0);
  for(let c=0;c<14;c++){let ch=row[flip?13-c:c];if(ch==='.')continue;
   if(ch==='E'){ch='V';if(eyesOn)eyes.push([x0+c+sh,y0+r])}
   px(x0+c+sh,y0+r,1,1,PAL[ch])}}
 if(player.moving){const feet=f?FEET.a:FEET.b;for(let c=0;c<14;c++)if(feet[c]==='b')px(x0+c,y,1,1,PAL.b)}
 const glow=RM?.16:.12+.06*Math.sin(t*2.2);
 for(const [ex,ey] of eyes){for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])px(ex+dx,ey+dy,1,1,`rgba(220,215,255,${glow})`);px(ex,ey,1,1,PAL.E)}
}
function drawArt(a,t){
 const s=w2s(a.x,a.y-14),R=34*P;
 const gr=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R);gr.addColorStop(0,hexA(a.col,a.secret?.1:.2));gr.addColorStop(1,hexA(a.col,0));ctx.fillStyle=gr;ctx.fillRect(s.x-R,s.y-R,R*2,R*2);
 px(a.x-9,a.y-6,18,9,'#07070A');px(a.x-8,a.y-5,16,4,'#2B2838');px(a.x-8,a.y-1,16,3,'#1A1823');px(a.x-3,a.y,6,1,a.col);px(a.x-8,a.y+3,16,1,'rgba(0,0,0,.4)');
 const bob=RM?0:Math.round(Math.sin(t*2+a.x)*1.5);
 px(a.x-4,a.y-5,8,1,'rgba(0,0,0,.45)');
 if(!(a.secret&&!RM&&hash(Math.floor(t*9),a.x)<.18))sprite(a.icon,iconPal(a),a.x-6,a.y-22+bob,false);
 if(!RM)for(let k=0;k<4;k++){const ph=(t*.45+k/4+a.x*.013)%1;ctx.globalAlpha=1-ph;px(a.x+Math.round(Math.sin(a.x+k*2.1)*9),a.y-8-Math.round(ph*26),1,1,a.col);ctx.globalAlpha=1}
}
function drawMono(t){
 const x=MONO.x,y=MONO.y,s=w2s(x,y-15),R=30*P,pulse=RM?.6:.5+.3*Math.sin(t*2.4);
 const gr=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,R);gr.addColorStop(0,hexA('#B79CFF',.18*pulse+.06));gr.addColorStop(1,hexA('#B79CFF',0));ctx.fillStyle=gr;ctx.fillRect(s.x-R,s.y-R,R*2,R*2);
 px(x-7,y,14,2,'rgba(0,0,0,.5)');
 px(x-6,y-28,12,29,'#07070A');px(x-5,y-27,10,27,'#1D1A28');px(x-5,y-27,2,27,'#2B2739');px(x-5,y-27,10,2,'#332F45');
 ctx.globalAlpha=.55+pulse*.45;const c='#B79CFF';

const keys=new Set();let joy={x:0,y:0};
const win=document.getElementById('win'),scrim=document.getElementById('scrim');
let titleOn=true;
const isOpen=()=>titleOn||!win.hidden;
// e.code is the physical key, so it works on any keyboard layout (RU included)
addEventListener('keydown',e=>{
 const k=e.code;
 if(titleOn){if((k==='Enter'||k==='NumpadEnter'||k==='Space')&&e.target.tagName!=='A'&&e.target.tagName!=='BUTTON'){e.preventDefault();hideTitle()}return}
 if(isOpen()){if(k==='Escape'){closeWin();e.preventDefault()}return}
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(k))e.preventDefault();
 if(k==='KeyE'||k==='Enter'||k==='Space'||k==='NumpadEnter'){if(e.repeat)return;const n=nearest();if(n){e.preventDefault();openWin(n.id)}return}
 if(k==='KeyM'){openList();return}
 keys.add(k);
});
addEventListener('keyup',e=>keys.delete(e.code));

 const r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)*DPR,sy=(e.clientY-r.top)*DPR,wx=(sx+OX)/P,wy=(sy+OY)/P;
 let best=null,bd=20;
 for(const it of INTER){const d=Math.hypot(it.x-wx,(it.y-14)-wy);if(d<bd){bd=d;best=it}}
 if(best)openWin(best.id);
});
cv.addEventListener('mousemove',e=>{
 const r=cv.getBoundingClientRect(),wx=((e.clientX-r.left)*DPR+OX)/P,wy=((e.clientY-r.top)*DPR+OY)/P;
 cv.style.cursor=INTER.some(it=>Math.hypot(it.x-wx,(it.y-14)-wy)<20)?'pointer':'default';
});
addEventListener('blur',()=>keys.clear());

const joyEl=document.getElementById('joy'),knob=document.getElementById('knob'),act=document.getElementById('act');
function showTouch(){coarse=true;joyEl.hidden=false;document.getElementById('hint').hidden=true}
if(coarse)showTouch();
addEventListener('touchstart',()=>{if(!coarse)showTouch()},{passive:true,once:true});
let joyId=null;
function joyMove(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const L=Math.hypot(dx,dy),max=44;if(L>max){dx*=max/L;dy*=max/L}knob.style.transform=`translate(${dx}px,${dy}px)`;joy={x:dx/max,y:dy/max};if(Math.hypot(joy.x,joy.y)<.18)joy={x:0,y:0}}
joyEl.addEventListener('pointerdown',e=>{joyId=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});
const joyEnd=e=>{if(e.pointerId!==joyId)return;joyId=null;joy={x:0,y:0};knob.style.transform=''};
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
act.addEventListener('click',()=>{const n=nearest();if(n)openWin(n.id)});

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function iconCanvas(a,sc){const c=document.createElement('canvas');c.width=12*sc;c.height=12*sc;const x=c.getContext('2d');const pal=iconPal(a);a.icon.forEach((row,r)=>[...row].forEach((ch,i)=>{if(ch!=='.'){x.fillStyle=pal[ch];x.fillRect(i*sc,r*sc,sc,sc)}}));return c}
function stageName(a,i){return i===3&&a.done?a.done[lang]:T().stages[i]}
function stagesHTML(a){const st=a.stage;return'<div class="stages">'+T().stages.map((s,i)=>`<span class="stage ${i===st?'on':i<st?'past':''}">${stageName(a,i)}</span>`).join('')+'</div>'}
let current=null,lastFocus=null;
const titleEl=document.getElementById('title');
function showTitle(){titleOn=true;keys.clear();if(!win.hidden)closeWin();titleEl.hidden=false;void titleEl.offsetWidth;titleEl.classList.remove('out');document.body.classList.add('titled');document.getElementById('tStart').focus({preventScroll:true})}
function hideTitle(){titleOn=false;titleEl.classList.add('out');document.body.classList.remove('titled');setTimeout(()=>{if(!titleOn)titleEl.hidden=true},RM?0:460);cv.focus?.()}
document.getElementById('tStart').addEventListener('click',hideTitle);
function renderTitle(){const t=T();$('tMark').textContent=t.tMark;$('tP1').textContent=t.spawnP1;$('tP2').textContent=t.spawnP2.replace('{n}',ARTS.length);$('tStart').textContent=t.start+' →';$('tKey').textContent=coarse?t.ctrlTouch:t.tKey;$('tTeam').innerHTML=t.team;$('tru').setAttribute('aria-pressed',lang==='ru');$('ten').setAttribute('aria-pressed',lang==='en')}
$('tru').addEventListener('click',()=>setLang('ru'));$('ten').addEventListener('click',()=>setLang('en'));
function openWin(id){
 if(id==='spawn'){showTitle();return}
 current=id;lastFocus=document.activeElement;keys.clear();
 const t=T();
 if(id==='spawn'){
  win.style.setProperty('--a','var(--green)');
  win.innerHTML=`<div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="path">~/spawn</span><button class="x" type="button" data-close aria-label="${t.close}">×</button></div>
  <div class="spawn"><div class="spawn-main">
   <div class="eyebrow">${t.spawnEyebrow}</div>
   <h1 class="big">RIKI<br>TIKI<br>TAVI</h1>
   <div class="studio">studio<span class="cur">_</span></div>
   <div class="eyebrow" style="color:var(--fg-2)">be better than yesterday</div>
   <p>${t.spawnP1}</p><p>${t.spawnP2.replace('{n}',ARTS.length)}</p>
   <div class="team">${t.team}</div>
   <div class="chips">
    <a class="chip" href="https://t.me/rtt_studio" target="_blank" rel="noopener"><b>TELEGRAM</b> @rtt_studio ↗</a>
    <a class="chip" href="https://www.youtube.com/@RikiDragons-l9f" target="_blank" rel="noopener"><b>YOUTUBE</b> @RikiDragons ↗</a>
    <a class="chip" href="https://github.com/rikidragons75-prog" target="_blank" rel="noopener"><b>GITHUB</b> rikidragons75-prog ↗</a>
    <span class="chip"><b>MAIL</b> rikidragons75@gmail.com</span>
   </div>
   <div class="controls">${coarse?t.ctrlTouch:t.ctrlDesk}</div>
   <div><button class="btn primary px" type="button" data-close>${t.start} →</button></div>
  </div><div class="vert">creative studio · est. 2026 · void-hub.online</div></div>`;
 }else if(id==='list'){
  win.style.setProperty('--a','var(--green)');
  win.innerHTML=`<div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="path">~/artifacts</span><button class="x" type="button" data-close aria-label="${t.close}">×</button></div>
  <div class="list-head"><h2>${t.listTitle}</h2><p>${t.listSub}</p></div><div class="grid" id="grid"></div>`;
  const grid=$('grid');
  for(const a of ARTS){const hide=a.secret&&!found.has(a.id);const b=document.createElement('button');b.type='button';b.className='card';b.style.setProperty('--c',a.col);
   b.appendChild(iconCanvas(a,4));const d=document.createElement('div');d.style.minWidth='0';
   d.innerHTML=`<div class="n">${a.name}</div><div class="t">${hide?t.locked:a[lang].type}</div><div class="s">${stageName(a,a.stage)}</div>`;b.appendChild(d);
   b.addEventListener('click',()=>openWin(a.id));grid.appendChild(b)}
 }else{
  const a=ARTS.find(x=>x.id===id),c=a[lang];
  win.style.setProperty('--a',a.col);
  const btn=(a.href?`<a class="btn primary px" href="${a.href}" target="_blank" rel="noopener">${c.btn} ↗</a>`:(c.btn?`<span class="btn off">${c.btn}</span>`:''))
   +(a.links||[]).map((l,i)=>`<a class="btn ${i===0&&!a.href?'primary ':''}px" href="${l.href}" target="_blank" rel="noopener">${l[lang]} ↗</a>`).join('');
  win.innerHTML=`<div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="path">~/artifacts/${a.id}</span><button class="x" type="button" data-close aria-label="${t.close}">×</button></div>
  <div class="art"><div class="icon-wrap" id="iw"><div class="name">${a.name}</div></div>
   <div class="box"><span class="legend">info</span>
    <div class="row"><b>${t.type}</b><span>${c.type}</span></div>
    <div class="row"><b>${t.stack}</b><span>${a.stack}</span></div>
    <div class="row"><b>${t.access}</b><span>${c.access}</span></div>
    <div class="row"><b>${t.status}</b><span>${stageName(a,a.stage)}</span></div>
    ${stagesHTML(a)}
   </div>
   <p class="full">${c.desc}</p>
   ${btn?`<div class="actions">${btn}</div>`:''}
  </div>`;
  $('iw').prepend(iconCanvas(a,8));
  if(!found.has(a.id))discover(a);
 }
 win.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeWin));
 win.hidden=false;scrim.hidden=false;win.scrollTop=0;
 const f=win.querySelector('[data-close]');f&&f.focus({preventScroll:true});
}
function closeWin(){win.hidden=true;scrim.hidden=true;current=null;if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
function openList(){openWin('list')}
scrim.addEventListener('click',closeWin);
$('listBtn').addEventListener('click',openList);

let toastT=0;
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}
function discover(a){found.add(a.id);store.set('found',[...found]);renderCount();
 if(found.size===ARTS.length)toast('> '+T().all);else toast(`> ${T().found}: ${a.name}  [${found.size}/${ARTS.length}]`)}
function renderCount(){const c=$('cells');c.innerHTML=ARTS.map(a=>`<i class="${found.has(a.id)?'on':''}"></i>`).join('');$('cntNum').textContent=`${found.size}/${ARTS.length}`}
function setLang(l){lang=l;store.set('lang',l);document.documentElement.lang=l;const t=T();
 $('lru').setAttribute('aria-pressed',l==='ru');$('len').setAttribute('aria-pressed',l==='en');
 $('cntLabel').textContent=t.artifacts;$('listBtn').textContent=t.list;$('hint').textContent=t.hint;$('actLabel').textContent=t.act;renderTitle();
 if(current)openWin(current)}
$('lru').addEventListener('click',()=>setLang('ru'));$('len').addEventListener('click',()=>setLang('en'));

/* ---------- loop ---------- */
let last=performance.now(),lastCoords='';
function step(now){
 const t=now/1000,dt=Math.min(.05,(now-last)/1000);last=now;
 // move
 let vx=0,vy=0;
 if(!isOpen()){
  if(keys.has('KeyA')||keys.has('ArrowLeft'))vx-=1;if(keys.has('KeyD')||keys.has('ArrowRight'))vx+=1;
  if(keys.has('KeyW')||keys.has('ArrowUp'))vy-=1;if(keys.has('KeyS')||keys.has('ArrowDown'))vy+=1;
  vx+=joy.x;vy+=joy.y;
 }
 const L=Math.hypot(vx,vy);if(L>1){vx/=L;vy/=L}
 player.moving=L>.05;
 if(player.moving){
  const sp=74*dt,ok=(x,y)=>M(x-4,y)&&M(x+4,y)&&M(x,y-3)&&M(x,y+1);
  const nx=player.x+vx*sp,ny=player.y+vy*sp;
  if(ok(nx,player.y))player.x=nx;if(ok(player.x,ny))player.y=ny;
  player.walk+=dt*7;
  player.dir=Math.abs(vx)>Math.abs(vy)?(vx<0?'left':'right'):(vy<0?'up':'down');
 }
 for(const a of ARTS)if(!found.has(a.id)&&Math.hypot(a.x-player.x,a.y-player.y)<42)discover(a);
 const k=RM?1:Math.min(1,dt*6);camX+=(player.x-camX)*k;camY+=(player.y-camY)*k;
 OX=Math.round(camX*P-W/2);OY=Math.round(camY*P-H/2);

 // void + stars
 ctx.fillStyle='#050507';ctx.fillRect(0,0,W,H);
 for(const s of stars){let sx=(s.x*W*1.4-camX*P*.25)%(W*1.4);if(sx<0)sx+=W*1.4;let sy=(s.y*H*1.4-camY*P*.25)%(H*1.4);if(sy<0)sy+=H*1.4;
  ctx.globalAlpha=RM?.6:.35+.35*Math.sin(t*1.3+s.ph);ctx.fillStyle=s.c;ctx.fillRect(sx|0,sy|0,s.s*Math.max(1,P>>1),s.s*Math.max(1,P>>1))}
 ctx.globalAlpha=1;
 // ground
 const vx0=OX/P,vy0=OY/P,x0=Math.max(0,Math.floor(vx0)),y0=Math.max(0,Math.floor(vy0)),x1=Math.min(G,Math.ceil(vx0+W/P)+1),y1=Math.min(G,Math.ceil(vy0+H/P)+1);
 if(x1>x0&&y1>y0)ctx.drawImage(ground,x0,y0,x1-x0,y1-y0,x0*P-OX,y0*P-OY,(x1-x0)*P,(y1-y0)*P);
 // entities by depth
 const ents=[{y:MONO.y,d:()=>drawMono(t)},{y:player.y,d:()=>drawPlayer(t)},...ARTS.map(a=>({y:a.y,d:()=>drawArt(a,t)}))].sort((a,b)=>a.y-b.y);
 for(const e of ents)e.d();
 // prompt
 const n=isOpen()?null:nearest();
 if(n){const bob=RM?0:Math.round(Math.sin(t*5)),bx=n.x-6,by=n.y-n.top-14+bob;
  px(bx,by,13,13,'#07070A');px(bx+1,by+1,11,11,'#6FE58A');px(bx+2,by+2,9,9,'#0B0B10');
  ctx.fillStyle='#6FE58A';ctx.font=`${8*P}px DotGothic16, monospace`;ctx.textAlign='center';ctx.textBaseline='middle';
  const c=w2s(n.x+.5,by+6.5);ctx.fillText(coarse?'!':'E',c.x,c.y);
  px(n.x-1,by+13,3,1,'#6FE58A');px(n.x,by+14,1,1,'#6FE58A');}
 if(act.hidden===!!n)act.hidden=!n;
 // edge arrows
 const m=30*DPR;ctx.font=`${10*DPR}px "JetBrains Mono", monospace`;ctx.textBaseline='middle';
 if(!titleOn)for(const a of ARTS){if(found.has(a.id))continue;const s=w2s(a.x,a.y-12);
  if(s.x>m&&s.x<W-m&&s.y>m+40*DPR&&s.y<H-m)continue;
  const dx=s.x-W/2,dy=s.y-H/2,sc=Math.min((W/2-m)/Math.abs(dx||1e-6),(H/2-m)/Math.abs(dy||1e-6)),ex=W/2+dx*sc,ey=H/2+dy*sc,ang=Math.atan2(dy,dx),z=7*DPR;
  ctx.save();ctx.translate(ex,ey);ctx.rotate(ang);ctx.fillStyle=a.col;ctx.beginPath();ctx.moveTo(z,0);ctx.lineTo(-z,-z*.8);ctx.lineTo(-z*.4,0);ctx.lineTo(-z,z*.8);ctx.closePath();ctx.fill();ctx.restore();
  const lab=`${a.name} ${Math.round(Math.hypot(a.x-player.x,a.y-player.y)/16)}${T().m}`,lx=ex-Math.cos(ang)*18*DPR,ly=ey-Math.sin(ang)*16*DPR;
  ctx.textAlign=Math.cos(ang)>.4?'right':Math.cos(ang)<-.4?'left':'center';ctx.fillStyle='rgba(5,5,7,.75)';const tw=ctx.measureText(lab).width,bx=ctx.textAlign==='right'?lx-tw:ctx.textAlign==='left'?lx:lx-tw/2;
  ctx.fillRect(bx-4*DPR,ly-8*DPR,tw+8*DPR,16*DPR);ctx.fillStyle=a.col;ctx.fillText(lab,lx,ly)}
 // coords
 const cs=`X ${fmt((player.x-CX)/16)}  Y ${fmt((CY-player.y)/16)}`;if(cs!==lastCoords){$('coords').textContent=cs;lastCoords=cs}
 requestAnimationFrame(step);
}
function fmt(v){v=Math.round(v);return(v<0?'−':'+')+String(Math.abs(v)).padStart(3,'0')}

function start(data){
 if(data&&typeof data.x==='number'&&M(data.x,data.y)){player.x=data.x;player.y=data.y;camX=data.x;camY=data.y}
 setLang(lang);renderCount();
 if(data&&data.skipTitle){titleOn=false;titleEl.hidden=true;titleEl.classList.add('out')}else showTitle();
 requestAnimationFrame(step);
}
window.claude?.hot?.snapshot?.(()=>({x:player.x,y:player.y,skipTitle:!titleOn}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
})();
</script>
